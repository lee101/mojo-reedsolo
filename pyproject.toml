[project]
name = "mojo-reedsolo"
version = "0.1.0"
description = "Reed-Solomon error correction with Mojo kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "reed-solomon", "error-correction", "fec"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "reedsolo==1.7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
